name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - feature/weather-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 2️⃣ Set up Go
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: go mod tidy

    # 4️⃣ Run tests
    - name: Run tests
      run: go test ./...

    # 5️⃣ Build Docker image
    - name: Build Docker image
      run: docker build -t go-weather-api .

    # 6️⃣ Deploy via SSH
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          docker pull go-weather-api || true
          docker stop go-weather-api || true
          docker rm go-weather-api || true
          docker run -d --name go-weather-api -p 8080:8080 go-weather-api
